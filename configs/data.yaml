# The official training data (the Vesuvius Challenge open-data bucket, CC BY-NC 4.0; attribution "Vesuvius Challenge -
# CT Scans of Herculaneum Papyri"). Paths are relative to the bucket. `surfnet sources` resolves these groups against
# the bucket into $SURFNET_DATA/catalog.json; to rebuild exactly the recorded dataset, copy
# configs/dataset/catalog.json there instead.
bucket: s3://vesuvius-challenge-open-data
cell_um: 47.46                       # the model's cell: ~5 voxels at 9.4 um
band: bands.yaml
neighbours_K: 3                      # neighbour windings -3..-1, 1..3 (winding-error starts and targets)
groups:
  pherc0139_gt:                      # the official ground-truth windings
    kind: windings
    sample: PHerc0139
    volume: PHerc0139/volumes/20250728140407-9.362um-1.2m-113keV-masked.zarr
    volume_id: "20250728140407"
    pitch_um: 9.362
    level: 0
    dense_volume_id: "20260102150214"      # the same meshes on the 2.399 um scan: used where the grids correspond
    windings: [23, 59]
    exclude_windings: [41, 42, 43, 44, 45, 46]   # inconsistent official windings (w041 / w042 coincide, w046 = w045)
    heldout_windings: [56, 57, 58, 59]           # w056-w057 validation, w058-w059 test
    tier: 2
  pherc1667_merged:                  # the official merged unwrap (31 wraps)
    kind: merged
    sample: PHerc1667
    volume: PHerc1667/volumes/20251217075048-2.399um-0.2m-78keV-masked.zarr
    pitch_um: 2.399
    level: 2                               # 9.596 um
    mesh: PHerc1667/segments/20260612121456-w011_20260108140509268_merged_v4_flatboi_straightened_v4/mesh/20260612121456-on-20251217075048-2.399um.tifxyz
    heldout_turn_fraction: [0.80, 0.86]    # a band of turns held out (validation)
    tier: 2
  ink_segments:                      # official segments with ink labels
    kind: segments
    samples: [PHercParis4, PHerc0814, PHerc0841, PHerc0009B, PHerc0500P2]   # (the recorded build has no PHerc0343P
                                                                           # segment; it stays out of a new listing)
    require_labels: true                   # ink-labels/<render volume>/<version>/supervision.zarr
    level_fine_scan: 2                     # the ~2.4 um volumes at level 2 (~9.6 um)
    tier: 3                                # whole segment (sigma 1.0 vox)
    label_tier: 2                          # labelled cells: the ink proves the winding
    exclude: ["20231031143852"]            # Paris 4 w02: kept out (an ink-detection test sentinel)
